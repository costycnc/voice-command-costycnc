<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controllo Vocale CNC MKS-DLC32</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover { background-color: #0056b3; }
        .status { margin-top: 25px; font-weight: bold; color: #555; }
        .detected { color: green; font-size: 20px; margin-top: 10px; }
        input { padding: 10px; font-size: 16px; width: 80%; text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Controllo Vocale MKS-DLC32</h2>
    
    <!-- Inserisci qui l'IP reale della tua scheda MKS -->
    <label for="ip">IP della Scheda MKS-DLC32:</label><br>
    <input type="text" id="cncIp" value="192.168.1.100" placeholder="Es. 192.168.1.100"><br>

    <button id="startBtn">Attiva Ascolto Vocale</button>
    
    <div class="status" id="statusField">Stato: Clicca sul pulsante per iniziare</div>
    <div class="detected" id="textField"></div>
</div>

<script>
    const startBtn = document.getElementById('startBtn');
    const statusField = document.getElementById('statusField');
    const textField = document.getElementById('textField');

    // Configurazione del riconoscimento vocale
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        statusField.textContent = "Errore: Il tuo browser non supporta il riconoscimento vocale. Usa Google Chrome.";
    } else {
        const recognition = new SpeechRecognition();
        recognition.lang = 'it-IT'; // Imposta la lingua italiana
        recognition.continuous = true; // Continua ad ascoltare
        recognition.interimResults = false;

        startBtn.addEventListener('click', () => {
            recognition.start();
            statusField.textContent = "Stato: In ascolto... Parla ora (Dì 'avanti')";
            statusField.style.color = "blue";
        });

        recognition.onresult = (event) => {
            const currentResultIndex = event.resultIndex;
            const textSpoken = event.results[currentResultIndex][0].transcript.toLowerCase().trim();
            textField.textContent = `Hai detto: "${textSpoken}"`;

            // Controllo della parola chiave
            if (textSpoken.includes('avanti')) {
                inviaComandoCNC();
            }
        };

        recognition.onerror = (event) => {
            statusField.textContent = `Errore di riconoscimento: ${event.error}`;
            statusField.style.color = "red";
        };

        recognition.onend = () => {
            // Riavvia automaticamente l'ascolto se si interrompe
            recognition.start();
        };
    }

    // Funzione per inviare il G-code alla scheda MKS-DLC32 tramite HTTP POST
    function inviaComandoCNC() {
        const ip = document.getElementById('cncIp').value;
        const url = `http://${ip}/command`; // Endpoint standard per FluidNC / GRBL WebUI
        
        // Il comando G-code: G91 (movimento relativo), G0 (rapido), Y10 (avanti di 10mm)
        // Cambia Y10 con X10 o Z10 a seconda di quale sia l'asse "avanti" sulla tua macchina
        const gcode = "G91 G0 Y10"; 

        statusField.textContent = "Stato: Invio comando 'Avanti' alla CNC...";
        statusField.style.color = "orange";

        // Invio della richiesta HTTP alla scheda
        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `cmd=${encodeURIComponent(gcode)}`
        })
        .then(response => {
            if(response.ok) {
                statusField.textContent = "Stato: Comando eseguito con successo!";
                statusField.style.color = "green";
            } else {
                statusField.textContent = "Errore: La scheda ha risposto con un errore.";
                statusField.style.color = "red";
            }
        })
        .catch(error => {
            console.error('Errore:', error);
            statusField.textContent = "Errore di connessione: Verifica che l'IP sia corretto e di essere connesso alla stessa rete Wi-Fi.";
            statusField.style.color = "red";
        });
    }
</script>

</body>
</html>
