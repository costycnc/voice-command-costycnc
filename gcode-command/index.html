<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controllo Vocale CNC MKS-DLC32</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn-group {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        button {
            padding: 15px 25px;
            font-size: 16px;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #startBtn { background-color: #28a745; } /* Verde */
        #startBtn:hover { background-color: #218838; }
        
        #stopBtn { background-color: #dc3545; } /* Rosso */
        #stopBtn:hover { background-color: #c82333; }
        
        .status { margin-top: 25px; font-weight: bold; color: #555; }
        .detected { color: green; font-size: 20px; margin-top: 10px; min-height: 30px; }
        input { padding: 10px; font-size: 16px; width: 80%; text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Controllo Vocale MKS-DLC32</h2>
    
    <label for="cncIp">IP della Scheda MKS-DLC32:</label><br>
    <input type="text" id="cncIp" value="192.168.1.100" placeholder="Es. 192.168.1.100"><br>

    <div class="btn-group">
        <button id="startBtn">Attiva Ascolto</button>
        <button id="stopBtn">Ferma Ascolto</button>
    </div>
    
    <div class="status" id="statusField">Stato: Spento</div>
    <div class="detected" id="textField"></div>
</div>

<script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusField = document.getElementById('statusField');
    const textField = document.getElementById('textField');

    let isListening = false; 

    // Configurazione del riconoscimento vocale
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        statusField.textContent = "Errore: Il tuo browser non supporta il riconoscimento vocale. Usa Google Chrome.";
        statusField.style.color = "red";
    } else {
        const recognition = new SpeechRecognition();
        recognition.lang = 'it-IT';
        recognition.continuous = true;
        recognition.interimResults = false;

        // Gestione pulsante ATTIVA
        startBtn.addEventListener('click', () => {
            isListening = true;
            recognition.start();
            statusField.textContent = "Stato: In ascolto... Dì 'avanti'";
            statusField.style.color = "blue";
        });

        // Gestione pulsante FERMA
        stopBtn.addEventListener('click', () => {
            isListening = false;
            recognition.stop();
            statusField.textContent = "Stato: Ascolto interrotto manualmente.";
            statusField.style.color = "red";
            textField.textContent = "";
        });

        // Gestione corretta e sicura dei risultati vocali
        recognition.onresult = (event) => {
            const lastResultIndex = event.results.length - 1;
            const resultObj = event.results[lastResultIndex];
            
            // Verifica che l'oggetto e la proprietà [0] esistano prima di procedere
            if (resultObj && resultObj[0]) {
                const textSpoken = resultObj[0].transcript.toLowerCase().trim();
                textField.textContent = `Hai detto: "${textSpoken}"`;

                if (textSpoken.includes('avanti')) {
                    inviaComandoCNC();
                }
            }
        };

        recognition.onerror = (event) => {
            if (event.error !== 'no-speech') {
                statusField.textContent = `Errore di riconoscimento: ${event.error}`;
                statusField.style.color = "red";
            }
        };

        recognition.onend = () => {
            // Riavvia l'ascolto se l'utente non ha premuto stop e la sessione scade
            if (isListening) {
                try {
                    recognition.start();
                } catch(e) {
                    console.log("Riconoscimento già attivo o in fase di avvio.");
                }
            }
        };
    }

    // Funzione per inviare il comando HTTP POST alla scheda MKS-DLC32
    function inviaComandoCNC() {
        const ip = document.getElementById('cncIp').value;
        const url = `http://${ip}/command`;
        const gcode = "G91 G0 Y10"; // Comando per asse Y in avanti di 10mm

        statusField.textContent = "Stato: Invio comando 'Avanti' alla CNC...";
        statusField.style.color = "orange";

        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `cmd=${encodeURIComponent(gcode)}`
        })
        .then(response => {
            if(response.ok) {
                statusField.textContent = "Stato: Comando eseguito! In ascolto...";
                statusField.style.color = "green";
            } else {
                statusField.textContent = "Errore: Risposta errata dalla scheda.";
                statusField.style.color = "red";
            }
        })
        .catch(error => {
            console.error('Errore:', error);
            statusField.textContent = "Errore di connessione. Controlla Wi-Fi e IP.";
            statusField.style.color = "red";
        });
    }
</script>

</body>
</html>
