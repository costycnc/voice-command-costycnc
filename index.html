<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Vocale</title>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            color: white;
            font-family: sans-serif;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
        }
        #controls {
            position: absolute;
            top: 20px;
            z-index: 10;
            text-align: center;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        button:hover { background: #ff3333; }
        button:disabled { background: #555; }
        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
            min-height: 20px;
        }
        canvas { 
            background: #000; 
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
<p><a href="cerchi">cerchi</a></p>
</body>
</html>
